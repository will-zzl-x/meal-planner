# Builds and deploys the app to Fly.io.
# Designed so the user never needs a terminal: this workflow creates the
# Fly app, the storage volume, and deploys, all from GitHub.
#
# One-time setup (all web, no terminal):
#   1. Sign up at https://fly.io (free; they ask for a card to prevent
#      abuse but won't charge unless you exceed the free tier).
#   2. In the Fly dashboard: top-right avatar → Account Settings →
#      Access Tokens → Create. Copy the token (starts with "FlyV1 ").
#   3. In this repo on GitHub: Settings → Secrets and variables →
#      Actions → New repository secret. Name: FLY_API_TOKEN. Paste the
#      token. Save.
#   4. Trigger this workflow: Actions tab → "Deploy to Fly.io" → Run
#      workflow. Pick the branch and click Run. (You can also re-run a
#      failed run from this tab — useful if the first push happened
#      before the secret was set.)
name: Deploy to Fly.io

on:
  push:
    branches:
      - main
      - "claude/**"  # working branches I push from
  workflow_dispatch: {}

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # The Fly app name. Must be globally unique across all Fly users.
  # If this name is taken when the workflow first runs, change it here
  # AND in fly.toml to match.
  FLY_APP: meal-planner-zzlx
  FLY_REGION: iad
  # Persistent disk for the SQLite DB. 1 GB is plenty for friends-and-
  # family scale and stays inside the free allowance.
  FLY_VOLUME: meal_planner_data
  FLY_VOLUME_SIZE_GB: 1

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group  # don't deploy two pushes at once
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app if it doesn't exist
        run: |
          if flyctl status -a "$FLY_APP" >/dev/null 2>&1; then
            echo "App $FLY_APP already exists — skipping create."
          else
            echo "Creating Fly app $FLY_APP..."
            flyctl apps create "$FLY_APP" --org personal
          fi

      - name: Create persistent volume if it doesn't exist
        run: |
          if flyctl volumes list -a "$FLY_APP" 2>/dev/null | grep -q "$FLY_VOLUME"; then
            echo "Volume $FLY_VOLUME already exists — skipping create."
          else
            echo "Creating volume $FLY_VOLUME (${FLY_VOLUME_SIZE_GB} GB)..."
            flyctl volumes create "$FLY_VOLUME" \
              --size "$FLY_VOLUME_SIZE_GB" \
              --region "$FLY_REGION" \
              --yes \
              -a "$FLY_APP"
          fi

      - name: Deploy
        run: flyctl deploy --remote-only -a "$FLY_APP"

      - name: Print app URL
        run: |
          echo "App deployed."
          echo "URL: https://${FLY_APP}.fly.dev"
