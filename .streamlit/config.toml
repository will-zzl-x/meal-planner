# Streamlit configuration. These are sensible production defaults; locally
# they take effect too but aren't harmful.

[server]
# Don't try to open a browser tab on the server.
headless = true

[browser]
# Don't ping Streamlit's stats endpoint.
gatherUsageStats = false

# EveryBite theme — EveryDollar's "clean, responsible, no-nonsense" structure
# warmed up for food. Deep navy primary for trust/structure; soft cream
# background instead of stark white so the whole page reads differently from
# default Streamlit; warmer secondary surface for cards/sidebar contrast.
# Adjust here only — every page picks it up.
[theme]
base = "light"
primaryColor = "#0F4C75"              # Deep navy — buttons, focus rings, links
backgroundColor = "#FBFAF6"           # Soft warm off-white (not pure white)
secondaryBackgroundColor = "#F0EBE0"  # Cream — cards, sidebar, code blocks
textColor = "#1A1A1A"                 # Near-black, slightly softer than #000
font = "sans serif"
